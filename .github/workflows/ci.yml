name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Los jobs comparten la misma key de caché de node_modules
  # (hash de package-lock.json), así npm ci se hace solo 1 vez y
  # los demás jobs restauran desde caché (rápido).
  #
  # NOTA: el deploy real lo hace Cloudflare Pages (build: npm run build → dist/).
  # Este CI solo valida: tests unitarios, build, e2e y lighthouse.

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - run: npm test
      - name: Build (genera dist)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-e2e
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-e2e.outputs.cache-hit != 'true' }}
        run: npm ci
      # Cache del navegador de Playwright: esto es lo que más tarda
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright deps (solo si no hay caché)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # e2e necesita dist/ servido por Playwright → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx playwright test
        env:
          CI: 1

  # Informativo y no bloqueante: los budgets de Lighthouse dependen del runner.
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-lh
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-lh.outputs.cache-hit != 'true' }}
        run: npm ci
      # Lighthouse necesita dist/ → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx lhci autorun --config=.lighthouserc.js
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTA: el deploy a producción lo hace Cloudflare Pages al pushear a main
  # (build: npm run build → dist/). La notificación push tras deploy exitoso
  # se gestiona en el workflow separado: .github/workflows/notify.yml
