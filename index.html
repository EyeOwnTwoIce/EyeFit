<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EyeFit">
<meta name="theme-color" content="#0A0A0A">
<title>EyeFit</title>
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root{
    --accent:#C8FF00; --bg:#0A0A0A; --surface:#141414; --surface2:#1E1E1E;
    --border:#2A2A2A; --text:#F0F0F0; --muted:#888; --danger:#ff4444;
    --blue:#4FC3F7; --green:#81C784; --orange:#FFB74D;
    --purple:#BA68C8; --redm:#F0625C;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;
     -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  html,body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    font-size:14px; overscroll-behavior-y:none; height:100%; width:100%;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    max-width:393px; margin:0 auto;
    overscroll-behavior:none;
  }
  #app{ min-height:100dvh; display:flex; flex-direction:column; position:relative; }

  /* ===== Header ===== */
  header{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 18px 8px; position:sticky; top:0; z-index:20;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .header-main{ display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-size:18px; font-weight:800; letter-spacing:-0.3px; }
  .stop-btn{
    background:var(--danger); color:#fff; border:none; border-radius:9px;
    padding:7px 16px; font-size:13px; font-weight:800; cursor:pointer;
    box-shadow:0 2px 10px rgba(255,68,68,.35);
  }
  .stop-btn:active{ transform:scale(.94); }

  /* ===== Barra de descanso superior (se vacía hacia la izquierda) ===== */
  .rest-bar{
    margin-top:8px; height:32px; border-radius:9px; background:var(--surface2);
    position:relative; overflow:hidden; flex-shrink:0;
  }
  .rest-bar-fill{
    position:absolute; inset:0; width:100%;
    background:linear-gradient(90deg,#4CAF50,var(--green));
    transform:scaleX(1); transform-origin:left center; transition:transform 1s linear;
  }
  .rest-bar-time{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:13px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;
    z-index:2; text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .rest-bar-btns{ position:absolute; right:4px; top:50%; transform:translateY(-50%); display:flex; gap:3px; z-index:2; }
  .rest-mini{
    background:var(--surface); border:1px solid var(--border); color:var(--green);
    font-size:9px; font-weight:800; border-radius:6px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  .rest-mini:active{ background:var(--green); color:#000; }

  /* ===== Bottom tab bar ===== */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; margin:0 auto; max-width:393px;
    background:rgba(20,20,20,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border); display:flex; z-index:100;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbtn{
    flex:1; background:none; border:none; color:var(--muted);
    font-size:9px; font-weight:600; padding:9px 2px 7px; display:flex;
    flex-direction:column; align-items:center; gap:3px; letter-spacing:0.2px;
  }
  .tabbtn .ic{ font-size:20px; line-height:1; }
  .tabbtn.active{ color:var(--accent); }

  /* ===== Scroll area ===== */
  main{ flex:1; padding:14px 14px 26px; padding-bottom:70px; }
  .section{ display:none; animation:fadein .18s ease; }
  .section.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  h2.title{
    font-size:16px; font-weight:800; margin:0 0 10px; padding-bottom:6px;
    border-bottom:2px solid var(--accent); display:inline-block;
  }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }

  /* ===== Week grid ===== */
  .week-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:12px; }
  .week-cell{
    border-radius:10px; padding:8px 2px; text-align:center; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; transition:all .15s;
  }
  .week-cell .d{ color:var(--muted); font-size:8.5px; margin-bottom:3px; font-weight:700; text-transform:uppercase; }
  .week-cell .l{ font-weight:700; font-size:8.5px; line-height:1.2; }
  .week-cell.active{ background:var(--accent); border-color:var(--accent); }
  .week-cell.active .d{ color:#000; }
  .week-cell.active .l{ color:#000; }

  /* ===== Day cards ===== */
  .day-card{ background:var(--surface); border-radius:14px; margin-bottom:12px; overflow:hidden; border:2px solid var(--border); }
  .day-header{ padding:10px 15px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .day-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-name{ font-weight:800; font-size:14px; }
  .day-type{ color:var(--muted); font-size:10.5px; margin-top:1px; }
  .day-body{ display:none; }
  .day-body.open{ display:block; }

  /* ===== Exercise rows ===== */
  .ex-row{ padding:10px 15px; border-bottom:1px solid var(--border); }
  .ex-row:last-child{ border-bottom:none; }
  .ex-top{ display:flex; align-items:flex-start; gap:10px; }
  .ex-img{
    width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0;
    background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--muted); overflow:hidden;
  }
  .ex-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-info{ flex:1; min-width:0; }
  .ex-num{ font-weight:800; font-size:11px; flex-shrink:0; }
  .ex-name{ font-weight:700; font-size:13px; line-height:1.3; }
  .ex-stats{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .stat-chip{ background:var(--surface2); border-radius:6px; padding:3px 8px; font-size:10px; color:#ccc; }
  .stat-chip b{ color:var(--accent); }
  .ex-notes{ color:var(--muted); font-size:10px; margin-top:5px; line-height:1.4; }
  .ex-instr-btn{
    background:none; border:1px solid var(--border); color:var(--accent); border-radius:6px;
    font-size:10px; padding:3px 8px; margin-top:6px; cursor:pointer; font-weight:600;
  }
  .ex-instr{ display:none; color:#ccc; font-size:11px; line-height:1.5; margin-top:6px; padding:8px 10px; background:var(--surface2); border-radius:8px; }
  .ex-instr.show{ display:block; }
  .instr-list{ padding-left:16px; margin:2px 0; }
  .instr-list li{ margin-bottom:3px; }
  .instr-list li::marker{ color:var(--accent); font-weight:800; }

  /* ===== Session (sin scroll) ===== */
  .session-view{ height:calc(100dvh - 150px); display:flex; flex-direction:column; overflow:hidden; }
  .session-progress{ padding:6px 14px 4px; }
  .sp-label{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .sp-pct{ color:var(--accent); font-size:13px; font-weight:800; }
  .sp-bar{ height:6px; border-radius:3px; background:var(--surface2); overflow:hidden; }
  .sp-fill{ height:100%; background:linear-gradient(90deg,var(--accent),#a8d400); border-radius:3px; transition:width .3s ease; }

  .ex-active-card{
    background:var(--surface); border:2px solid var(--accent); border-radius:14px;
    margin:6px 14px; overflow:hidden; flex-shrink:0;
  }
  .ex-active-header{ padding:9px 13px; background:var(--accent); color:#000; display:flex; justify-content:space-between; align-items:center; }
  .ex-active-name{ font-weight:800; font-size:13px; }
  .ex-active-count{ font-size:11px; font-weight:700; }
  .ex-active-body{ padding:8px 13px 10px; }
  /* GIF completo sin recortar */
  .ex-active-img{
    width:100%; height:min(28dvh, 230px); object-fit:contain; border-radius:8px;
    margin-bottom:6px; background:var(--surface2);
  }

  .variant-btn{
    background:none; border:1px dashed var(--accent); color:var(--accent); border-radius:7px;
    font-size:10px; font-weight:700; padding:5px 10px; width:100%; margin-bottom:6px; cursor:pointer;
  }
  .variant-btn:active{ background:rgba(200,255,0,.1); }

  .sets-grid{ display:flex; flex-direction:column; gap:5px; overflow-y:auto; flex:1; padding:0 14px 8px; }
  .set-row{
    display:flex; align-items:center; gap:8px; background:var(--surface2);
    border-radius:8px; padding:6px 10px;
  }
  .set-num{ font-weight:800; font-size:12px; color:var(--accent); width:16px; flex-shrink:0; }
  .set-control{ display:flex; align-items:center; gap:4px; flex:1; min-width:0; }
  .stepper{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--accent); font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .stepper:active{ background:var(--accent); color:#000; }
  .set-value{
    font-size:13px; font-weight:800; min-width:34px; text-align:center; font-variant-numeric:tabular-nums;
    cursor:pointer; padding:2px 5px; border-radius:6px; color:var(--text);
  }
  .set-label{ color:var(--muted); font-size:8.5px; text-transform:uppercase; letter-spacing:.4px; }
  .set-done{
    width:30px; height:30px; border-radius:9px; border:1.5px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:14px; color:transparent; cursor:pointer; flex-shrink:0;
  }
  .set-done.done{ background:var(--accent); border-color:var(--accent); color:#000; }
  .del-set-btn{
    background:none; border:none; color:var(--danger); font-size:14px; cursor:pointer;
    flex-shrink:0; padding:4px;
  }
  .del-set-btn:active{ opacity:.6; }
  .add-set-btn{
    background:none; border:1px dashed var(--accent); color:var(--accent); border-radius:8px;
    font-size:11px; font-weight:800; padding:8px; cursor:pointer; margin-top:2px;
  }
  .add-set-btn:active{ background:rgba(200,255,0,.1); }

  /* ===== Comic bubble (Mortadelo) ===== */
  .comic-overlay{
    position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.88);
    display:none; align-items:center; justify-content:center; max-width:393px; margin:0 auto;
  }
  .comic-overlay.show{ display:flex; }
  .comic-bubble{
    background:#FFE600; color:#000; padding:30px 26px; border-radius:20px;
    border:5px solid #000; font-size:36px; font-weight:900; text-transform:uppercase;
    text-align:center; position:relative; max-width:320px; line-height:1.1;
    transform:rotate(-3deg); animation:comicPop .5s cubic-bezier(.2,1.6,.4,1);
    box-shadow:12px 12px 0 rgba(0,0,0,.7);
  }
  .comic-bubble::after{
    content:""; position:absolute; bottom:-26px; left:50%; margin-left:-12px;
    border:13px solid transparent; border-top-color:#000; border-top-width:26px;
  }
  .comic-bubble::before{
    content:""; position:absolute; bottom:-42px; left:50%; margin-left:-7px;
    border:8px solid transparent; border-top-color:#FFE600; border-top-width:16px;
  }
  @keyframes comicPop{
    0%{ transform:scale(.2) rotate(-15deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(4deg); }
    100%{ transform:scale(1) rotate(-3deg); opacity:1; }
  }
  .comic-shake{ animation:comicShake .3s ease infinite alternate; }
  @keyframes comicShake{
    from{ transform:rotate(-4deg); } to{ transform:rotate(-1deg); }
  }

  /* ===== Summary screen (guardado automático) ===== */
  .summary-overlay{
    position:fixed; inset:0; z-index:350; background:var(--bg);
    display:none; flex-direction:column; max-width:393px; margin:0 auto; padding:20px; overflow-y:auto;
  }
  .summary-overlay.show{ display:flex; }
  .sum-title{ font-size:22px; font-weight:900; text-align:center; margin:10px 0 4px; }
  .sum-sub{ color:var(--muted); font-size:12px; text-align:center; margin-bottom:16px; }
  .sum-saved-msg{
    background:rgba(200,255,0,.12); border:1px solid var(--accent); color:var(--accent);
    border-radius:10px; padding:9px; text-align:center; font-size:12px; font-weight:800; margin-bottom:12px;
  }
  .sum-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .sum-stat{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 10px; text-align:center;
  }
  .sum-stat .sv{ font-size:24px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; }
  .sum-stat .sl{ color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.7px; margin-top:3px; font-weight:700; }
  .sum-ex{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; margin-bottom:8px; }
  .sum-ex-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }
  .sum-ex-sub{ color:var(--muted); font-size:10px; margin-top:3px; }
  .sum-btns{ display:flex; gap:10px; margin-top:auto; padding-top:10px; }
  .sum-btns button{ flex:1; border-radius:12px; padding:14px; font-size:14px; font-weight:800; border:none; cursor:pointer; }
  .sum-save{ background:var(--accent); color:#000; }

  /* ===== History ===== */
  .hist-day{ background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:9px; overflow:hidden; }
  .hist-day-top{
    padding:12px 15px; display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .hist-day-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .hist-day-name{ font-weight:800; font-size:13px; }
  .hist-day-date{ color:var(--muted); font-size:10px; margin-left:auto; }
  .hist-day-chev{ color:var(--muted); font-size:12px; transition:transform .2s; }
  .hist-day.open .hist-day-chev{ transform:rotate(90deg); }
  .hist-day-body{ display:none; border-top:1px solid var(--border); padding:10px 15px; }
  .hist-day.open .hist-day-body{ display:block; }
  .hist-day-stats{ color:var(--muted); font-size:10px; margin-bottom:7px; }
  .hist-ex{ display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:11px; }
  .hist-ex-name{ flex:1; color:#ccc; font-weight:600; }
  .hist-ex-set{ color:var(--muted); font-weight:600; flex-shrink:0; margin-left:6px; font-size:10px; }
  .hist-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .hist-stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; }
  .hist-stat .v{ font-size:17px; font-weight:800; color:var(--accent); }
  .hist-stat .l{ color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }

  /* ===== Settings ===== */
  .set-group{ margin-bottom:12px; }
  .set-group-title{ color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.8px; font-weight:700; margin-bottom:6px; }
  .set-row-item{
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:12px 15px; margin-bottom:7px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .set-row-item .label{ font-size:12.5px; font-weight:600; }
  .set-row-item .desc{ color:var(--muted); font-size:10px; margin-top:2px; line-height:1.4; }
  .btn{ background:var(--accent); color:#000; border:none; border-radius:9px; padding:9px 14px; font-size:12px; font-weight:800; cursor:pointer; flex-shrink:0; }
  .btn:active{ transform:scale(.96); }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-danger{ background:var(--danger); color:#fff; }

  /* ===== Auth ===== */
  #authOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.97); z-index:250;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    max-width:393px; margin:0 auto; padding:24px;
  }
  #authOverlay.show{ display:flex; }
  .auth-card{ width:100%; max-width:320px; }
  .auth-logo{ text-align:center; font-size:44px; margin-bottom:4px; }
  .auth-title{ text-align:center; font-size:22px; font-weight:800; margin-bottom:2px; }
  .auth-sub{ text-align:center; color:var(--muted); font-size:11px; margin-bottom:16px; }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:12px; background:var(--surface2); border-radius:10px; padding:4px; }
  .auth-tabs button{ flex:1; border:none; background:none; color:var(--muted); font-size:12px; font-weight:700; padding:8px; border-radius:8px; cursor:pointer; }
  .auth-tabs button.active{ background:var(--accent); color:#000; }
  .auth-input{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:15px; margin-bottom:10px; outline:none;
  }
  .auth-input:focus{ border-color:var(--accent); }
  .auth-input::placeholder{ color:var(--muted); }
  .auth-btn{ width:100%; background:var(--accent); color:#000; border:none; border-radius:10px; padding:13px; font-size:14px; font-weight:800; cursor:pointer; margin-top:2px; }
  .auth-btn:disabled{ opacity:.5; }
  .auth-error{ color:var(--danger); font-size:11.5px; min-height:16px; margin-top:10px; text-align:center; }
  .auth-info{ margin-top:12px; text-align:center; font-size:10px; color:var(--muted); line-height:1.6; }

  /* ===== Num pad + slider ===== */
  #numOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:240;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    max-width:393px; margin:0 auto; padding:24px;
  }
  #numOverlay.show{ display:flex; }
  .num-label{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:12px; }
  .num-input{
    width:180px; background:transparent; border:none; border-bottom:2px solid var(--accent);
    color:var(--accent); font-size:44px; font-weight:800; text-align:center; outline:none;
    font-variant-numeric:tabular-nums; padding:0 0 4px; margin-bottom:22px;
  }
  .num-slider{
    width:280px; max-width:85vw; accent-color:var(--accent); margin-bottom:22px; height:34px;
  }
  .num-btns{ display:flex; gap:10px; }
  .num-btns button{ padding:11px 26px; border-radius:10px; font-size:13px; font-weight:800; border:none; cursor:pointer; }
  .num-cancel{ background:var(--surface2); color:var(--text); }
  .num-ok{ background:var(--accent); color:#000; }

  /* ===== Variants (grid 2xN con GIFs) ===== */
  #varOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:245;
    display:none; flex-direction:column; max-width:393px; margin:0 auto; padding:20px 16px;
  }
  #varOverlay.show{ display:flex; }
  .var-title{ font-size:17px; font-weight:800; margin-bottom:4px; }
  .var-sub{ color:var(--muted); font-size:11px; margin-bottom:14px; }
  .var-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1; min-height:0; align-content:stretch; }
  .var-item{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    cursor:pointer; display:flex; flex-direction:column; overflow:hidden; min-height:0;
  }
  .var-item:active{ border-color:var(--accent); }
  .var-item img{ width:100%; flex:1; min-height:0; object-fit:contain; background:var(--surface2); display:block; }
  .var-noimg{
    flex:1; min-height:0; background:var(--surface2); display:flex; align-items:center;
    justify-content:center; font-size:30px; color:var(--muted);
  }
  .var-item .vi-name{ padding:7px 8px; font-weight:700; font-size:11px; text-align:center; color:#ccc; line-height:1.25; }
  .var-close{ margin-top:14px; background:var(--surface2); color:var(--text); border:none; border-radius:10px; padding:12px; font-size:13px; font-weight:700; cursor:pointer; }

  .toast{
    position:fixed; bottom:calc(80px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--accent); color:#000; padding:10px 18px; border-radius:10px;
    font-size:12px; font-weight:700; z-index:500; opacity:0; transition:opacity .25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
  #fileInput{ display:none; }

  return null;
}
/* Devuelve el GIF de una alternativa por nombre.
   Prioridad: mapa embebido → coincidencia EXACTA en dataset (evita falsos positivos de alternativas manuales) */
function getExerciseImageForName(name, dataset){
  if(!name) return null;
  for(const [key,val] of Object.entries(EMBEDDED_IMAGES)){
    if(normalizeName(key)===normalizeName(name)){
      return IMG_BASE + "videos/" + val + ".gif";
    }
  }
  if(dataset){
    const n = normalizeName(name);
    const found = dataset.find(d=>d.name && normalizeName(d.name)===n);
    if(found && found.image){
      const base = String(found.image).replace("images/","").replace(".jpg","").replace(".png","");
      return IMG_BASE + "videos/" + base + ".gif";
    }
  }
  return null;
}

/* ================================================================

   ================================================================ */
const HEADER_MAP = {
  "dia":"dia","orden":"orden","nombre_es":"nombre_es","nombre":"nombre_es",
  "dataset":"dataset","ejercicio":"nombre_es","series":"series","sets":"series",
  "reps":"reps","repeticiones":"reps","peso_kg":"peso_kg","peso":"peso_kg",
  "kg":"peso_kg","descanso_s":"descanso_s","descanso":"descanso_s","rest_s":"descanso_s",
  "notas":"notas","nota":"notas"
};
function parseRoutineSheet(data){
  const wb = XLSX.read(data, { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
  const routine = []; const seen = new Set();
  for(const row of rows){
    const mapped = {};
    for(const [orig,target] of Object.entries(HEADER_MAP)){
      const v = row[orig];
      if(v !== undefined && mapped[target] === undefined){
        mapped[target] = (target==="orden"||target==="series"||target==="reps") ? parseInt(v,10)||0 : v;
      }
    }
    const dia = String(mapped.dia||"").trim();
    const nombre = String(mapped.nombre_es||"").trim();
    if(!dia || !nombre) continue;
    const id = dia+"|"+nombre;
    if(seen.has(id)) continue;
    seen.add(id);
    routine.push({
      dia, orden: mapped.orden||0, nombre_es: nombre,
      dataset: String(mapped.dataset||"").trim(),
      series: mapped.series?parseInt(mapped.series,10)||3:3,
      reps: mapped.reps?parseInt(mapped.reps,10)||8:8,
      peso_kg: parseFloat(mapped.peso_kg)||0,
      descanso_s: mapped.descanso_s?parseInt(mapped.descanso_s,10)||90:90,
      notas: String(mapped.notas||"").trim()
    });
  }
  routine.sort((a,b)=>{
    const di = DAY_ORDER.indexOf(a.dia)-DAY_ORDER.indexOf(b.dia);
    if(di!==0) return di;
    return (a.orden||0)-(b.orden||0);
  });
  const od = {};
  for(const ex of routine){ od[ex.dia]=(od[ex.dia]||0)+1; ex.orden=od[ex.dia]; }
  return routine;
}
async function loadRoutineFromXlsx(){
  try{
    const resp = await fetch("rutina.xlsx", { cache:"no-store" });
    if(!resp.ok) throw new Error("no fetch");
    const buf = await resp.arrayBuffer();
    const routine = parseRoutineSheet(new Uint8Array(buf));
    if(routine.length===0) throw new Error("vacío");
    if(!lsGet(K.routine, null)) setRoutine(routine);
  }catch(e){}
}
function exportRoutineXlsx(){
  const routine = getRoutine();
  const headers = ["dia","orden","nombre_es","dataset","series","reps","peso_kg","descanso_s","notas"];
  const rows = [headers];
  for(const ex of routine) rows.push([ex.dia,ex.orden,ex.nombre_es,ex.dataset,ex.series,ex.reps,ex.peso_kg,ex.descanso_s,ex.notas||""]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = headers.map(h=>({wch:h==="nombre_es"?40:h==="dataset"?50:h==="notas"?55:12}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rutina");
  XLSX.writeFile(wb, "rutina.xlsx");
}

function normalizeName(s){
  return String(s||"").toLowerCase().trim().replace(/[^\w\sà-úá-ú]/g,"").replace(/\s+/g," ");
}
function findExerciseInDataset(dataset, name){
  if(!dataset || name==="") return null;
  const n = normalizeName(name);
  let hit = dataset.find(d=>normalizeName(d.name)===n);
  if(hit) return hit;
  hit = dataset.find(d=>normalizeName(d.name).includes(n)||n.includes(normalizeName(d.name)));
  if(hit) return hit;
  const words = n.split(" ");
  for(const w of words){
    if(w.length<3) continue;
    hit = dataset.find(d=>normalizeName(d.name).includes(w));
    if(hit) return hit;
  }
  return null;
}

function escapeHtml(s){
  const el = document.createElement('div');
  el.textContent = String(s||"");
  return el.innerHTML;
}
function formatInstructions(text){
  if(!text) return "";
  const steps = String(text).split("\n").map(s=>s.trim()).filter(Boolean);
  return `<ol class="instr-list">${steps.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ol>`;
}

/* Convierte un error de Supabase/red a texto legible.
   Filtra mensajes vacíos o inútiles ({} , "", etc.) para no mostrar
   objetos crudos en pantalla. */
function errToString(err){
  if(!err) return "Error de conexión";
  if(typeof err === "string") return err.trim() ? err : "Error de conexión";
  const rawMsg = err.message;
  if(typeof rawMsg === "string" && rawMsg.trim() && rawMsg.trim() !== "{}") return rawMsg.trim();
  if(err.name === "AuthRetryableFetchError" || err.status >= 500){
    return "⚠️ Error del servidor de EyeFit. Está caído o en mantenimiento. Inténtalo más tarde.";
  }
  for(const k of ["msg","error_description","error"]){
    const v = err[k];
    if(typeof v === "string" && v.trim() && v.trim() !== "{}") return v.trim();
  }
  try{
    const s = JSON.stringify(err);
    if(s && s !== "{}" && s !== '""' && s !== "null" && s !== '{"message":"{}"}') return s;
  }catch(e){}
  return "Error de conexión";
}

function isEmailVerified(user){
  return !!(user && (user.email_confirmed_at || user.email_verified === true));
}

async function handleAuthSubmit(){
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;
  const errEl = document.getElementById("authError");
  const btn = document.getElementById("authSubmit");
  errEl.textContent = "";
  if(!sbClient){ errEl.textContent = "🌐 Sin conexión al servidor. No puedes acceder ahora."; return; }
  if(!email || !pass){ errEl.textContent = "Introduce email y contraseña"; return; }
  if(pass.length < 6){ errEl.textContent = "La contraseña debe tener al menos 6 caracteres"; return; }
  btn.disabled = true; btn.textContent = "…";
  try{
    let result;
    if(authMode === "register") result = await sbClient.auth.signUp({ email, password: pass });
    else result = await sbClient.auth.signInWithPassword({ email, password: pass });
    if(result.error) throw result.error;
    const session = result.data.session;
    const user = result.data.user || null;
    if(!session){
      if(authMode === "register"){
        if(user && user.identities && user.identities.length === 0){
          errEl.textContent = "⚠️ Ya existe una cuenta con ese email. Intenta acceder.";
        } else {
          errEl.textContent = "✅ Revisa tu email para confirmar el registro";
        }
      } else {
        errEl.textContent = "⚠️ Email no confirmado o credenciales incorrectas";
      }
      btn.disabled = false; btn.textContent = authMode === "register" ? "Registrarse" : "Acceder";
      return;
    }
    /* Verificar que el email esté confirmado antes de permitir el acceso */
    if(!isEmailVerified(user)){
      await sbClient.auth.signOut().catch(()=>{});
      errEl.textContent = "⚠️ Debes confirmar tu email antes de acceder. Revisa tu bandeja de entrada.";
      btn.disabled = false;
      btn.textContent = authMode === "register" ? "Registrarse" : "Acceder";
      return;
    }
    authUser = user;
    await afterLogin();
    btn.disabled = false;
    btn.textContent = authMode === "register" ? "Registrarse" : "Acceder";
  }catch(err){
    errEl.textContent = errToString(err);
    btn.disabled = false;
    btn.textContent = authMode === "register" ? "Registrarse" : "Acceder";
  }
}
async function afterLogin(){
  showAuthOverlay(false);
  await syncPending();
  await pullServerData();
  renderMain();
}
async function pullServerData(){
  if(!sbClient || !authUser) return;
  try{
    const { data: routineRow, error: errR } = await sbClient.from("rutinas").select("routine").eq("user_id", authUser.id).maybeSingle();
    if(!errR && routineRow && routineRow.routine && Array.isArray(routineRow.routine)){
      setRoutine(routineRow.routine);
      selectedDay = null;
    }
    const { data: sesRows, error: errS } = await sbClient.from("sesiones").select("data").eq("user_id", authUser.id);
    if(!errS && Array.isArray(sesRows)){
      const serverHistory = sesRows.map(r=>r.data).filter(Boolean);
      const local = getHistory();
      const merged = [...serverHistory];
      for(const h of local){
        const dup = merged.some(m=>m.date===h.date && m.day===h.day);
        if(!dup) merged.push(h);
      }
      merged.sort((a,b)=>new Date(b.date)-new Date(a.date));
      saveHistory(merged);
    }
  }catch(e){}
}
async function pushRoutineToServer(){
  if(!sbClient || !authUser) return false;
  try{
    const { error } = await sbClient.from("rutinas").upsert({ user_id:authUser.id, routine:getRoutine() }, { onConflict:"user_id" });
    return !error;
  }catch(e){ return false; }
}
async function pushSessionToServer(record){
  if(!sbClient || !authUser) return false;
  try{
    const { error } = await sbClient.from("sesiones").insert({ user_id:authUser.id, data:record });
    return !error;
  }catch(e){ return false; }
}

/* Fix subida automática: reintento cada 30s mientras haya pendientes */
async function syncPending(){
  if(!sbClient || !authUser) return;
  const pending = getPending();
  let changed = false;
  const remaining = [];
  for(const rec of pending.sessions){
    const ok = await pushSessionToServer(rec);
    if(ok){ changed = true; } else { remaining.push(rec); break; }
  }
  if(pending.routine){
    const { error } = await sbClient.from("rutinas").upsert({ user_id:authUser.id, routine:pending.routine }, { onConflict:"user_id" }).catch(()=>({error:true}));
    if(!error){ setRoutine(pending.routine); pending.routine = null; changed = true; }
  }
  pending.sessions = remaining;
  setPending(pending);
  if(changed){
    showToast("🔄 Sincronizado con la nube");
    if(currentTab === "ajustes") renderMain();
  }
}

function computeSummary(){
  const completedSets = session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const totalReps = session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+s.reps,0),0);
  const totalWeight = session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(s.kg*s.reps),0),0);
  const elapsed = Math.floor((Date.now()-session.startTime)/1000)+session.baseElapsed;
  const completedEx = session.exercises.filter(e=>e.completed).length;
  return { completedSets, totalReps, totalWeight, elapsed, completedEx, totalEx: session.exercises.length, exList: session.exercises };
}

/* Guarda la sesión automáticamente (sin botones Guardar/Descartar) */
async function autoSaveSession(){
  if(!session) return;
  const anyDone = session.exercises.some(e=>e.sets.some(s=>s.done));
  if(!anyDone) return;
  session.elapsed = Math.floor((Date.now()-session.startTime)/1000)+session.baseElapsed;
  const record = {
    date: new Date().toISOString(),
    day: session.day,
    duration: session.elapsed,
    exercises: session.exercises.map(e=>({
      nombre_es: e.nombre_es, dataset: e.dataset, orden: e.orden, completed: e.completed,
      sets: e.sets.map(s=>({ kg:s.kg, reps:s.reps, done:s.done }))
    }))
  };
  const history = getHistory();
  history.push(record);
  saveHistory(history);

  const savedMsg = document.getElementById("sumSavedMsg");
  if(sbClient && authUser){
    const ok = await pushSessionToServer(record);
    if(ok){
      if(savedMsg) savedMsg.textContent = "✅ Sesión guardada en la nube";
      showToast("✅ Sesión guardada en la nube");
    } else {
      const p = getPending(); p.sessions.push(record); setPending(p);
      if(savedMsg) savedMsg.textContent = "📴 Sin conexión: se subirá sola";
      showToast("📴 Sin conexión: se subirá sola");
    }
  } else {
    if(savedMsg) savedMsg.textContent = "✅ Sesión guardada en este dispositivo";
    showToast("✅ Sesión guardada");
  }
}

function showSummary(){
  if(!session) return;
  stopRest();
  pendingSummary = computeSummary();
  autoSaveSession();
  const s = pendingSummary;
  const mins = Math.floor(s.elapsed/60), secs = s.elapsed%60;
  document.getElementById("sumSub").textContent = `${session.day} · ${mins}m ${String(secs).padStart(2,"0")}s`;
  document.getElementById("sumGrid").innerHTML = `
    <div class="sum-stat"><div class="sv">${s.completedSets}</div><div class="sl">Series</div></div>
    <div class="sum-stat"><div class="sv">${s.totalReps}</div><div class="sl">Reps</div></div>
    <div class="sum-stat"><div class="sv">${s.completedEx}/${s.totalEx}</div><div class="sl">Ejercicios</div></div>
    <div class="sum-stat"><div class="sv">${Math.round(s.totalWeight)}<span style="font-size:12px;"> kg</span></div><div class="sl">Peso total</div></div>`;
  document.getElementById("sumExList").innerHTML = s.exList.filter(e=>e.sets.some(x=>x.done)).slice(0,10).map(e=>{
    const done = e.sets.filter(x=>x.done);
    return `<div class="sum-ex">

      <div class="sum-ex-sub">${done.map(x=>`${x.kg}kg`).join(" · ")}</div>
    </div>`;
  }).join("");
  document.getElementById("summaryOverlay").classList.add("show");
  document.getElementById("stopSessionBtn").style.display = "none";
}

/* ================================================================
   DESCANSO — barra superior (se vacía hacia la izquierda)
   ================================================================ */
let restTimer = null;
let restRemaining = 0;
let restTotal = 0;
let restPaused = false;
let restActive = false;

function clearRestTimer(){
  if(restTimer){ clearInterval(restTimer); restTimer = null; }
}

function startRest(seconds){
  clearRestTimer();
  restRemaining = seconds;
  restTotal = seconds;
  restPaused = false;
  restActive = true;
  const bar = document.getElementById("restBar");
  if(bar){
    bar.style.display = "flex";
    const btn = document.getElementById("restPauseBtn");
    if(btn) btn.textContent = "⏸";
    renderRestTime();
  }
  restTimer = setInterval(()=>{
    if(restPaused) return;
    if(restRemaining <= 0){
      restFinished();
      return;
    }
    restRemaining--;
    renderRestTime();
    if(restRemaining <= 3 && restRemaining > 0) vibrate(60);
    if(restRemaining === 0) vibrate([100,80,100]);
  }, 1000);
}

function stopRest(){
  clearRestTimer();
  restActive = false;
  const bar = document.getElementById("restBar");
  if(bar) bar.style.display = "none";
}

function restFinished(){
  clearRestTimer();
  restActive = false;
  const bar = document.getElementById("restBar");
  if(bar) bar.style.display = "none";
  vibrate([150,100,150]);
  showMotivation();
}

function renderRestTime(){
  const m = Math.floor(restRemaining/60), s = restRemaining%60;
  const timeEl = document.getElementById("restBarTime");
  if(timeEl) timeEl.textContent = `${m}:${String(s).padStart(2,"0")}`;
  const fill = document.getElementById("restBarFill");
  if(fill && restTotal > 0){
    fill.style.transform = `scaleX(${restRemaining/restTotal})`;
  }
  const btn = document.getElementById("restPauseBtn");
  if(btn) btn.textContent = restPaused ? "▶" : "⏸";
}

/* ================================================================
   VARIANTES (grid con GIFs, rellenan la pantalla)
   ================================================================ */
function getVariants(ex){
  const res = [];
  const manuales = ALTERNATIVAS[ex.dataset] || [];
  for(const nombre of manuales) res.push({ nombre, part: getExerciseBodyPart(ex, datasetCache) || "musculatura similar" });
  if(res.length < 3 && datasetCache){
    const found = findExerciseInDataset(datasetCache, ex.dataset) || findExerciseInDataset(datasetCache, ex.nombre_es);
    if(found && found.part){
      const auto = datasetCache.filter(d=>d.part===found.part && normalizeName(d.name)!==normalizeName(found.name)).slice(0,3-res.length);
      for(const a of auto) res.push({ nombre:a.name, part:a.part });
    }
  }
  return res.slice(0, 4);
}

function openVariants(){
  const ex = session.exercises[session.currentIdx];
  const variants = getVariants(ex);
  document.getElementById("varCurrentEx").textContent = "Ejercicio actual: " + getApodo(ex);
  /* 4 tarjetas en grid 2x2: mantener actual + 3 alternativas (con GIF) */
  const items = [
    { nombre: "Mantener: " + getApodo(ex), img: getExerciseImage(ex, datasetCache) },
    ...variants.map(v=>({ nombre: v.nombre, img: getExerciseImageForName(v.nombre, datasetCache) }))
  ];
  const list = document.getElementById("varList");
  list.innerHTML = `<div class="var-grid">${items.map((it,i)=>`
    <div class="var-item" data-variant-idx="${i}">
      ${it.img ? `<img src="${it.img}" alt="${escapeHtml(it.nombre)}" loading="lazy" onerror="this.remove()">` : `<div class="var-noimg">🏋️</div>`}
      <div class="vi-name">${escapeHtml(it.nombre)}</div>
    </div>`).join("")}</div>`;
  document.getElementById("varOverlay").classList.add("show");
}

function selectVariant(i){
  const ex = session.exercises[session.currentIdx];
  if(i === 0){ document.getElementById("varOverlay").classList.remove("show"); return; } // mantener actual
  const v = getVariants(ex)[i-1];
  if(!v) return;
  ex.dataset = v.nombre;
  ex.nombre_es = v.nombre;
  document.getElementById("varOverlay").classList.remove("show");
  saveSessionState();
  renderMain();
  showToast("↔️ Variante: " + v.nombre);
}

/* ================================================================
   HISTORIAL colapsable con apodos
   ================================================================ */
function renderHistorial(){
  const history = getHistory();
  if(!history || history.length===0){
    return `<div class="section active">
      <h2 class="title">📈 Historial</h2>
      <div class="empty-state">Aún no hay sesiones.<br>Termina tu primer entrenamiento.</div>
    </div>`;
  }

  const totalSessions = history.length;
  const totalTime = history.reduce((a,h)=>a+(h.duration||0),0);
  const totalSets = history.reduce((a,h)=>a+h.exercises.reduce((b,e)=>b+e.sets.filter(s=>s.done).length,0),0);

  const recent = [...history].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);

  const histHtml = recent.map((h,hi)=>{
    const dateStr = new Date(h.date).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
    const mins = Math.floor((h.duration||0)/60), secs=(h.duration||0)%60;
    const exDone = h.exercises.filter(e=>e.sets.some(s=>s.done)==true);
    const color = DAY_COLORS[h.day] || "#fff";
    return `<div class="hist-day" data-hist="${hi}">
      <div class="hist-day-top">
        <div class="hist-day-dot" style="background:${color}"></div>
        <span class="hist-day-name" style="color:${color}">${h.day}</span>
        <span class="hist-day-date">${dateStr} · ${mins}m ${secs}s</span>
        <span class="hist-day-chev">▶</span>
      </div>
      <div class="hist-day-body">
        <div class="hist-day-stats">${exDone.length} ejercicios · ${h.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)} series</div>
        ${exDone.slice(0,10).map(e=>`<div class="hist-ex">
          <span class="hist-ex-name">${getApodo(e)}</span>
          <span class="hist-ex-set">${e.sets.filter(s=>s.done).map(s=>`${s.reps}×${s.kg}`).join(" · ")}</span>
        </div>`).join("")}
      </div>
    </div>`;
  }).join("");

  return `<div class="section active">
    <h2 class="title">📈 Historial</h2>
    <div class="hist-summary">
      <div class="hist-stat"><div class="v">${totalSessions}</div><div class="l">Sesiones</div></div>
      <div class="hist-stat"><div class="v">${Math.floor(totalTime/60)}m</div><div class="l">Tiempo total</div></div>
      <div class="hist-stat"><div class="v">${totalSets}</div><div class="l">Series</div></div>
    </div>
    ${histHtml}
    <button class="btn btn-danger" style="width:100%;" data-clear-history>🗑️ Borrar historial</button>
  </div>`;
}

function getExerciseBodyPart(ex, dataset){
  if(!dataset || !ex.dataset) return "";
  const found = findExerciseInDataset(dataset, ex.dataset) || findExerciseInDataset(dataset, ex.nombre_es);
  return found && found.part ? found.part : "";
}

function attachEvents(){
  document.querySelectorAll("[data-day]").forEach(el=>{
    el.addEventListener("click", ()=>{ selectedDay = el.dataset.day; renderMain(); });
  });
  document.querySelectorAll("[data-instr-toggle]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const body = document.querySelector(`[data-instr-body="${btn.dataset.instrToggle}"]`);
      if(body){ body.classList.toggle("show"); btn.textContent = body.classList.contains("show")?"📖 Ocultar":"📖 Instrucciones"; }
    });
  });
  document.querySelectorAll("[data-start-session]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ startSession(btn.dataset.startSession); });
  });
  /* Steppers: actualización in-place (sin parpadeo) + propagación de kg y reps a las siguientes */
  document.querySelectorAll("[data-kg-plus],[data-kg-minus],[data-reps-plus],[data-reps-minus]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!session) return;
      const ex = session.exercises[session.currentIdx];
      const si = parseInt(btn.dataset.kgPlus ?? btn.dataset.kgMinus ?? btn.dataset.repsPlus ?? btn.dataset.repsMinus);
      const set = ex.sets[si];
      if(btn.dataset.kgPlus) set.kg = +(set.kg+0.5).toFixed(1);
      if(btn.dataset.kgMinus) set.kg = Math.max(0, +(set.kg-0.5).toFixed(1));
      if(btn.dataset.repsPlus) set.reps = set.reps+1;
      if(btn.dataset.repsMinus) set.reps = Math.max(1, set.reps-1);
      for(let j=si+1; j<ex.sets.length; j++){
        if(btn.dataset.kgPlus || btn.dataset.kgMinus) ex.sets[j].kg = set.kg;
        if(btn.dataset.repsPlus || btn.dataset.repsMinus) ex.sets[j].reps = set.reps;
      }
      saveSessionState();
      updateSessionSetValues();
    });
  });
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", ()=> openNumPad(parseInt(el.dataset.edit), el.dataset.field));
  });
  document.querySelectorAll("[data-set-done]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!session) return;
      const ex = session.exercises[session.currentIdx];
      const si = parseInt(btn.dataset.setDone);
      const set = ex.sets[si];
      if(set.done) return;
      set.done = true;
      vibrate(30);
      saveSessionState();
      if(ex.currentSet < ex.sets.length){
        ex.currentSet++;
        startRest(ex.descanso_s);
        renderMain();
      } else {
        ex.completed = true;
        stopRest();
        if(session.currentIdx+1 < session.exercises.length){
          session.currentIdx++;
          renderMain();
        } else {
          showSummary();
        }
      }
    });
  });
  /* Eliminar una serie */
  document.querySelectorAll("[data-set-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!session) return;
      const ex = session.exercises[session.currentIdx];
      const si = parseInt(btn.dataset.setDel);
      if(ex.sets.length<=1) return;
      if(confirm("¿Eliminar la serie "+(si+1)+"?")){
        ex.sets.splice(si,1);
        if(ex.currentSet > si+1) ex.currentSet--;
        if(ex.currentSet > ex.sets.length) ex.currentSet = ex.sets.length;
        if(ex.currentSet < 1) ex.currentSet = 1;
        if(ex.sets.every(s=>s.done)) ex.completed = true; else ex.completed = false;
        saveSessionState();
        renderMain();
      }
    });
  });
  /* Añadir una serie extra */
  document.querySelectorAll("[data-add-set]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!session) return;
      const ex = session.exercises[session.currentIdx];
      const last = ex.sets[ex.sets.length-1] || { kg:parseFloat(ex.peso_kg)||0, reps:parseInt(ex.reps)||8 };
      ex.sets.push({ kg:last.kg, reps:last.reps, done:false });
      ex.completed = false;
      saveSessionState();
      renderMain();
    });
  });
  document.querySelectorAll("[data-open-variants]").forEach(btn=>{
    btn.addEventListener("click", openVariants);
  });
  document.querySelectorAll("[data-import-xlsx]").forEach(btn=>{
    btn.addEventListener("click", ()=>document.getElementById("fileInput").click());
  });
  document.querySelectorAll("[data-export-xlsx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ exportRoutineXlsx(); showToast("📤 rutina.xlsx descargado"); });
  });
  document.querySelectorAll("[data-clear-history]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(confirm("¿Borrar todo el historial?")){
        saveHistory([]);
        if(sbClient && authUser){ try{ await sbClient.from("sesiones").delete().eq("user_id", authUser.id); }catch(e){} }
        renderMain(); showToast("🗑️ Historial borrado");
      }
    });
  });
  document.querySelectorAll("[data-reset-routine]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      localStorage.removeItem(K.routine);
      selectedDay = null;
      if(sbClient && authUser){ try{ await sbClient.from("rutinas").delete().eq("user_id", authUser.id); }catch(e){} }
      showToast("↺ Rutina restaurada");
      setTab("rutina");
    });
  });
  document.querySelectorAll("[data-logout]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(confirm("¿Cerrar sesión?")){
        if(sbClient) await sbClient.auth.signOut().catch(()=>{});
        authUser = null;
        showToast("🚪 Sesión cerrada");
        showAuthOverlay(true);
        if(currentTab==="ajustes") renderMain();
      }
    });
  });
  document.querySelectorAll("[data-open-auth]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      authMode = "login"; updateAuthTabs();
      document.getElementById("authPass").value = "";
      document.getElementById("authError").textContent = "";
      showAuthOverlay(true);
    });
  });
  document.querySelectorAll("[data-sync-now]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{ await syncPending(); renderMain(); });
  });
  /* Historial colapsable */
  document.querySelectorAll("[data-hist]").forEach(el=>{
    el.addEventListener("click", ()=> el.classList.toggle("open"));
  });
}

/* ================================================================
   NUM PAD + SLIDER
   ================================================================ */
let numPadCtx = { idx:0, field:"kg" };
function openNumPad(idx, field){
  numPadCtx = { idx, field };
  const ex = session.exercises[session.currentIdx];
  const set = ex.sets[idx];
  document.getElementById("numLabel").textContent = field==="kg" ? "Peso (kg)" : "Repeticiones";
  const input = document.getElementById("numInput");
  input.value = field==="kg" ? set.kg : set.reps;
  input.step = field==="kg" ? "0.5" : "1";
  input.min = field==="kg" ? "0" : "1";
  const slider = document.getElementById("numSlider");
  slider.min = field==="kg" ? "0" : "1";
  slider.max = field==="kg" ? "200" : "30";
  slider.step = field==="kg" ? "0.5" : "1";
  slider.value = input.value;
  document.getElementById("numOverlay").classList.add("show");
  setTimeout(()=>input.focus(), 100);
}
function closeNumPad(){ document.getElementById("numOverlay").classList.remove("show"); }
function confirmNumPad(){
  if(!session){ closeNumPad(); return; }
  const val = parseFloat(document.getElementById("numInput").value);
  if(isNaN(val)){ closeNumPad(); return; }
  const ex = session.exercises[session.currentIdx];
  const set = ex.sets[numPadCtx.idx];
  if(numPadCtx.field==="kg"){
    set.kg = Math.max(0, +(val).toFixed(1));
    for(let j=numPadCtx.idx+1; j<ex.sets.length; j++) ex.sets[j].kg = set.kg;
  } else {
    set.reps = Math.max(1, Math.round(val));
    for(let j=numPadCtx.idx+1; j<ex.sets.length; j++) ex.sets[j].reps = set.reps;
  }
  saveSessionState();
  closeNumPad();
  updateSessionSetValues();
}
document.getElementById("numOk").addEventListener("click", confirmNumPad);

let toastTimeout = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove("show"), 2400);
}
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

/* Persistencia de sesión activa */
function saveSessionState(){ if(session) lsSet(K.session, session); }
function clearSessionState(){ localStorage.removeItem(K.session); localStorage.removeItem(K.sets); }
function restoreSession(){
  const saved = lsGet(K.session, null);
  if(saved && saved.exercises && Array.isArray(saved.exercises) && saved.exercises.length){
    session = saved;
    stopRest();
  }
}

/* Busca en el historial la última vez que se hizo este ejercicio y devuelve
   los sets reales ({kg,reps}) de esa sesión — respeta las diferencias de
   peso/reps entre series. Si no hay historial, devuelve null. */
function getLastExercisePerformance(ex){
  const history = getHistory();
  if(!history || history.length===0) return null;
  const key = String(ex.dataset||ex.nombre_es||"").trim().toLowerCase();
  if(!key) return null;
  const matches = [];
  for(const h of history){
    for(const e of (h.exercises||[])){
      const eKey = String(e.dataset||e.nombre_es||"").trim().toLowerCase();
      if(eKey === key){
        const done = (e.sets||[]).filter(s=>s.done);
        if(done.length > 0) matches.push({ date:h.date, sets:done.map(s=>({ kg:s.kg, reps:s.reps })) });
        break;
      }
    }
  }
  if(matches.length===0) return null;
  matches.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return matches[0].sets;
}

function startSession(day){
  const routine = getRoutine();
  const dayEx = routine.filter(e=>e.dia===day).sort((a,b)=>(a.orden||0)-(b.orden||0));
  if(dayEx.length===0) return;
  session = {
    day, startTime: Date.now(), elapsed: 0, baseElapsed: 0, currentIdx: 0,
    exercises: dayEx.map(ex=>{
      const lastPerf = getLastExercisePerformance(ex);
      let sets;
      if(lastPerf && lastPerf.length > 0){
        /* Usar el rendimiento real de la última sesión de este ejercicio,
           serie a serie. Si hubo más series en la última sesión que las
           programadas, se rellenan con la última usada en la rutina. */
        sets = Array.from({length:parseInt(ex.series)||3}, (_,i)=>{
          const p = lastPerf[i] || lastPerf[lastPerf.length-1] || {};
          return { kg: parseFloat(p.kg) ?? (parseFloat(ex.peso_kg)||0), reps: parseInt(p.reps) ?? (parseInt(ex.reps)||8), done:false };
        });
      } else {
        sets = Array.from({length:parseInt(ex.series)||3}, ()=>({ kg:parseFloat(ex.peso_kg)||0, reps:parseInt(ex.reps)||8, done:false }));
      }
      return { ...ex, completed:false, currentSet:1, sets };
    })
  };
  saveSessionState();
  selectedDay = day;
  setTab("sesion");
}

/* ================================================================
   INIT
   ================================================================ */
(function attachStaticHandlers(){
  document.querySelectorAll(".tabbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>setTab(btn.dataset.tab));
  });
  /* Botones de descanso: se enlazan UNA sola vez (evita listeners duplicados del bug ±15s) */
  document.querySelectorAll("[data-rest]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.dataset.rest==="skip"){ stopRest(); }
      else if(btn.dataset.rest==="toggle"){ restPaused = !restPaused; renderRestTime(); }
      else if(btn.dataset.rest==="minus15"){
        restRemaining = Math.max(0, restRemaining-15);
        if(restRemaining <= 0){ restFinished(); return; }
        restTotal = restRemaining;
        renderRestTime();
      }
      else if(btn.dataset.rest==="plus15"){
        restRemaining += 15;
        restTotal = restRemaining;
        renderRestTime();
      }
    });
  });
  const fileInput = document.getElementById("fileInput");
  if(fileInput){
    fileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const routine = parseRoutineSheet(new Uint8Array(ev.target.result));
          if(routine.length===0){ showToast("⚠️ Archivo sin ejercicios válidos"); return; }
          setRoutine(routine);
          selectedDay = null;
          if(sbClient && authUser){
            const ok = await pushRoutineToServer();
            if(!ok){ const p=getPending(); p.routine=routine; setPending(p); }
          }
          showToast("✅ Rutina importada: " + routine.length + " ejercicios");
          setTab("rutina");
        }catch(err){ showToast("❌ No se pudo leer el archivo"); }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = "";
    };
  }
})();

(async function init(){
  let authenticated = false;
  if(sbClient){
    try{
      const { data: authData } = await sbClient.auth.getSession();
      authUser = authData.session ? authData.session.user : null;
      /* Solo permitir acceso si el email está verificado */
      if(authUser && isEmailVerified(authUser)) authenticated = true;
      else{
        if(authUser) await sbClient.auth.signOut().catch(()=>{});
        authUser = null;
        showAuthOverlay(true);
      }
    }catch(e){ showAuthOverlay(true); }
  } else {
    showAuthOverlay(true);
  }

  const datasetPromise = loadExerciseDataset();
  await loadRoutineFromXlsx();
  restoreSession();
  renderMain();
  datasetCache = await datasetPromise;
  renderMain();
  updateStopBtn();

  if(authenticated){
    await syncPending();
    await pullServerData();
    renderMain();
  }
})();

/* Fix subida automática: reintento cada 30s si hay pendientes */
setInterval(async ()=>{
  if(authUser && sbClient){
    const pending = getPending();
    if(pending.sessions.length > 0 || pending.routine){
      await syncPending();
      if(currentTab === "ajustes") renderMain();
    }
  }
}, 30000);
