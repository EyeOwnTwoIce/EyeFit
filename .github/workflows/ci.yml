name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npx eslint utils.js tests/ generate_rutina.js generate_icons.js 2>&1 || true
