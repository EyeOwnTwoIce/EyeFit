name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Mínimo privilegio: los jobs que no despliegan no tocan Pages.
# npm 11+ (bundled con Node 24) bloquea los scripts de instalación por defecto,
# así que cada job habilita ignore-scripts=false explícitamente para paquetes
# con postinstall (p. ej. esbuild en la build).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 1

  # Informativo y no bloqueante: los budgets de Lighthouse dependen del runner
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - run: npm ci
      - run: npm run build
      - run: npx lhci autorun --config=.lighthouserc.js

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build-test, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - run: npm ci
      - run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4