name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Los jobs comparten la misma key de caché de node_modules
  # (hash de package-lock.json), así npm ci se hace solo 1 vez y
  # los demás jobs restauran desde caché (rápido).
  #
  # NOTA: el deploy a producción se hace en DOS sitios:
  #   - GitHub Pages: job deploy-pages (abajo) publica dist/ con actions/deploy-pages.
  #   - Cloudflare Pages: se dispara solo al hacer push a main (Git integration,
  #     build: npm run build → dist/).
  # Este CI además valida: tests unitarios, build, e2e y lighthouse.

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - run: npm test
      - name: Build (genera dist)
        run: npm run build
      - name: Upload dist artefacto para deploy
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-e2e
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-e2e.outputs.cache-hit != 'true' }}
        run: npm ci
      # Cache del navegador de Playwright: esto es lo que más tarda
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright deps (solo si no hay caché)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # e2e necesita dist/ servido por Playwright → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx playwright test
        env:
          CI: 1

  # Informativo y no bloqueante: los budgets de Lighthouse dependen del runner.
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-lh
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-lh.outputs.cache-hit != 'true' }}
        run: npm ci
      # Lighthouse necesita dist/ → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx lhci autorun --config=.lighthouserc.js
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publica dist/ en GitHub Pages (https://eyeowntwoice.github.io/EyeFit/).
  # Depende SOLO de build-test: el job e2e es flaky a veces y no debe bloquear
  # el deploy (igual que Lighthouse es informativo). Requiere que en el repo
  # Settings → Pages → Source esté configurado como "GitHub Actions".
  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Reutilizar el dist ya generado en build-test (sin re-descargar node_modules ni re-buildear)
      - name: Download dist build
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # NOTA: el deploy a Cloudflare Pages se dispara solo al pushear a main
  # (Git integration, build: npm run build → dist/). La notificación push tras
  # deploy exitoso se gestiona en el workflow separado: .github/workflows/notify.yml
