name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Disparo manual: permite re-desplegar y re-notificar sin tocar código
  # (Actions → CI → Run workflow). Útil para probar notificaciones push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Los jobs comparten la misma key de caché de node_modules
  # (hash de package-lock.json), así npm ci se hace solo 1 vez y
  # los demás jobs restauran desde caché (rápido).
  #
  # NOTA: el deploy a producción se hace en GitHub Pages vía el job
  # deploy-pages (abajo), que publica dist/ con actions/deploy-pages y
  # después avisa por Web Push a los suscritos (Edge Function 'eyefit-push').
  # Este CI además valida: tests unitarios, build, e2e y lighthouse.

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - run: npm test
      - name: Build (genera dist)
        run: npm run build
      - name: Upload dist artefacto para deploy
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-e2e
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-e2e.outputs.cache-hit != 'true' }}
        run: npm ci
      # Cache del navegador de Playwright: esto es lo que más tarda
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright deps (solo si no hay caché)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # e2e necesita dist/ servido por Playwright → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx playwright test
        env:
          CI: 1

  # Informativo y no bloqueante: los budgets de Lighthouse dependen del runner.
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow install scripts (esbuild/postinstall)
        run: npm config set ignore-scripts=false
      - name: Cached npm ci
        uses: actions/cache@v4
        id: npm-cache-lh
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            npm-${{ runner.os }}-
      - if: ${{ steps.npm-cache-lh.outputs.cache-hit != 'true' }}
        run: npm ci
      # Lighthouse necesita dist/ → build propio
      - name: Build (genera dist)
        run: npm run build
      - run: npx lhci autorun --config=.lighthouserc.js
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publica dist/ en GitHub Pages (https://eyeowntwoice.github.io/EyeFit/).
  # Depende SOLO de build-test: el job e2e es flaky a veces y no debe bloquear
  # el deploy (igual que Lighthouse es informativo). Requiere que en el repo
  # Settings → Pages → Source esté configurado como "GitHub Actions".
  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    # GitHub Pages admite UN solo deployment activo a la vez. Si se empujan dos
    # commits seguidos, dos runs pueden llegar aquí casi a la vez y el segundo
    # falla ("Deployment request failed ... due to in progress deployment").
    # Con este grupo de concurrencia por rama, los deploys se SERIALIZAN: el
    # segundo job espera a que termine el primero (no se cancela nada).
    concurrency:
      group: deploy-pages-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Historial completo (incl. tags): el paso de notificación lee el último tag de
      # release creado por auto-tag.yml (git tag --points-at HEAD) para anunciar la
      # versión REAL, no la de package.json (que el release automático no actualiza).
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      # Reutilizar el dist ya generado en build-test (sin re-descargar node_modules ni re-buildear)
      - name: Download dist build
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist
      # Limpiar artefactos 'github-pages' de intentos/re-runs previos: deploy-pages@v4
      # falla con "Multiple artifacts named github-pages" si encuentra 2 artefactos
      # con el mismo nombre (cada re-run sube uno nuevo sin borrar el anterior).
      - name: Limpiar artefactos github-pages previos
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: 'github-pages',
            });
            for (const a of data.artifacts) {
              console.log(`Borrando artefacto github-pages ${a.id} (${a.size_in_bytes} B)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # Notificar a los usuarios suscritos que la app se actualizó (Web Push real-time).
      # Se llama justo después del deploy a GitHub Pages: la Edge Function de Supabase
      # 'eyefit-push' lee las suscripciones de push_subscriptions y envía el push con VAPID.
      # El título muestra la versión del RELEASE real: el tag que auto-tag.yml crea sobre el
      # commit desplegado (p.ej. v2.2.2). package.json NO se actualiza en el release
      # automático, así que no se usa como fuente (solo como fallback si no hay tag).
      # El cuerpo: fecha/hora del release en hora de Madrid + "Toca para actualizar".
      # Requiere los secretos del repo: SUPABASE_PUSH_FN_URL (y SUPABASE_PUSH_FN_KEY si aplica).
      - name: Notify push update (Supabase Edge Function)
        if: success()
        env:
          TZ: Europe/Madrid
        run: |
          if [ -z "${{ secrets.SUPABASE_PUSH_FN_URL }}" ]; then
            echo "⚠️ SUPABASE_PUSH_FN_URL no configurado — salto notificación push."
            exit 0
          fi
          # Espera (máx ~60 s) a que auto-tag.yml etiquete el commit desplegado; si no
          # hay tag de release, cae a la versión de package.json.
          VERSION=""
          for i in $(seq 1 12); do
            git fetch --tags --force --quiet 2>/dev/null || true
            VERSION="$(git tag --points-at HEAD 2>/dev/null | grep -E '^v[0-9]' | sort -V | tail -1 | sed 's/^v//')"
            [ -n "$VERSION" ] && break
            sleep 5
          done
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
            echo "⚠️ Sin tag de release para este commit; uso versión de package.json (${VERSION})."
          fi
          RELEASE_TIME="$(date '+%d/%m/%Y %H:%M')"
          PAYLOAD="$(printf '{"title":"V%s disponible","body":"%s · Toca para actualizar","url":"./"}' "$VERSION" "$RELEASE_TIME")"
          curl -sS -X POST "${{ secrets.SUPABASE_PUSH_FN_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUSH_FN_KEY }}" \
            -d "$PAYLOAD" \
            && echo "Push enviado: V${VERSION} disponible" || echo "El servicio push no respondió (no bloquea)."

  # NOTA: el deploy se hace SOLO a GitHub Pages (el deploy-pages de arriba).
  # El aviso Web Push tras cada deploy lo hace el paso "Notify push update"
  # del propio job deploy-pages (sin depender de servicios externos).
