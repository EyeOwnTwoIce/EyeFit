name: Etiquetado Automático y Release

on:
  push:
    branches:
      - main
  # Disparo manual: permite crear un release sin tocar código (p.ej. si un push
  # se saltó el CI con [skip ci]). Coherente con el workflow_dispatch de ci.yml.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Historial completo: github-tag-action calcula el changelog
          # convencional desde el último tag y necesita el historial de commits.
          fetch-depth: '0'

      - name: Bump version y crear tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        # Solo crea el release si realmente se generó un tag nuevo
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          # Aquí inyectamos el changelog generado en el paso anterior
          body: ${{ steps.tag_version.outputs.changelog }}

      # Mantiene package.json sincronizado con el tag recién creado.
      # La versión de release se calcula a partir del TAG (no de package.json),
      # así que sin este paso package.json se queda congelado en su versión inicial.
      # El push va con GITHUB_TOKEN (no dispara nuevos workflows) y con [skip ci].
      - name: Sincronizar package.json con el tag
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "package.json ya está en $VERSION; nada que hacer."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): sincronizar package.json a ${NEW_TAG} [skip ci]"
          git push origin HEAD:main
