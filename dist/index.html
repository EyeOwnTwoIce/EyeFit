<!-- Critical CSS inline: el shell (header+tabbar) se pinta sin esperar al CSS completo -->
<style>:root{--accent:#C8FF00;--bg:#000000;--surface:#141414;--surface2:#1C1C1E;--border:#2C2C2E;--text:#F2F2F7;--muted:#8E8E93;--danger:#FF453A;--blue:#0A84FF;--green:#30D158;--orange:#FFD60A;--purple:#BF5AF2;--redm:#FF6961}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;touch-action:manipulation}button,.tabbtn,.week-cell,.set-value,.del-set-btn,.set-done,.add-set-btn,.stepper,.ex-instr-btn,.variant-btn,.day-header,.hist-day-top,.rest-mini{-webkit-user-select:none;user-select:none}html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,SF Pro Text,SF Pro Display,system-ui,sans-serif;font-size:14px;overscroll-behavior:none;height:100%;width:100%;overflow:hidden;position:fixed;inset:0}body{padding-top:0;padding-bottom:calc(80px + env(safe-area-inset-bottom));width:100%;margin:0 auto;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}#app{height:100dvh;max-height:100dvh;width:100vw;display:flex;flex-direction:column;position:relative}main{flex:1;min-height:0;overflow-y:auto;overflow-x:clip;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;padding:12px 14px calc(110px + env(safe-area-inset-bottom))}main::-webkit-scrollbar{display:none}main.no-scroll{overflow:hidden}header{background:#141414d9;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);padding:10px 18px 6px;position:sticky;top:0;z-index:20;padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0}.header-main{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.header-title-wrap{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}header h1{font-size:18px;font-weight:800;letter-spacing:-.3px;flex-shrink:0}.session-ex-name{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;ov {position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.7)}.rest-bar-btns{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:3px;z-index:2}.rest-mini{background:var(--surface);border:1px solid var(--border);color:var(--green);font-size:9px;font-weight:800;border-radius:6px;padding:4px 6px;cursor:pointer;line-height:1}.rest-mini:active{background:var(--green);color:#000}.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:540px;display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-radius:27px 27px 0 0;border-bottom:none;background:linear-gradient(145deg,#ffffff29,#ffffff0a),#1e1e2247;backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 32px #0000008c,inset 0 1px #ffffff38,inset 0 -14px 26px #ffffff0a;z-index:100}.tabbar:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.18),transparent 55%),radial-gradient(55% 85% at 12% 22%,rgba(255,255,255,.1),transparent 50%),radial-gradient(55% 85% at 88% 26%,rgba(255,255,255,.08),transparent 50%)}.tabbtn{position:relative;flex:1;background:none;border:none;color:#ffffffb3;font-size:9px;font-weight:600;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.2px;border-radius:18px;transition:color .18s ease}.tabbtn .ic{position:relative;z-index:1;font-size:22px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));transition:transform .18s cubic-bezier(.3,1.4,.5,1)}.tabbtn>span:not(.ic){position:relative;z-index:1}.tabbtn.active{color:#fff}.tabbtn.active .ic{transform:translateY(-1px) scale(1.08)}.tabbtn.active:after{content:"";position:absolute;top:2px;left:50%;transform:translate(-50%);width:46px;height:31px;border-radius:16px;z-index:0;background:linear-gradient(180deg,#ffffff3d,#ffffff0f);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 1px #ffffff47,0 2px 8px #00000047}.section{display:none;animation:fadein .18s ease}.section.active{display:block;content-visibility:auto;contain-intrinsic-size:auto 400px}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
<!-- CSS completo: media="print" evita render-blocking; app.js lo activa a media="all" -->
<link id="fullCssLink" rel="stylesheet" href="styles.461361c2.css" media="print">
<noscript><link rel="stylesheet" href="styles.461361c2.css"></noscript>
</head>
<body>
<div id="app">
  <header id="appHeader">
    <div class="header-main">
      <div class="header-title-wrap">
        <h1 id="appTitle" fetchpriority="high">EyeFit</h1>
        <!-- Apodo del ejercicio en curso (visible solo con sesión activa) -->
        <span class="session-ex-name" id="sessionExName" style="display:none;" aria-live="polite"></span>
      </div>
      <div class="header-actions">
        <!-- Cronómetro de sesión a la izquierda del botón STOP -->
        <span class="session-timer" id="sessionTimer" style="display:none;">00:00</span>
        <button class="stop-btn" id="stopSessionBtn" style="display:none;" aria-label="Detener sesión">⏹ STOP</button>
      </div>
    </div>
    <!-- Barra de progreso de sesión con porcentaje (segmentos por ejercicio + marcas de series) -->
    <div class="sess-progress-wrap" id="sessProgressWrap" style="display:none;">
      <div class="sess-pct-row">
        <span class="sess-pct" id="sessPct">0%</span>
        <span class="sess-day" id="sessDay"></span>
      </div>
      <div class="sess-bar" id="sessBar" aria-hidden="true"></div>
    </div>
    <!-- Barra de descanso superior: se vacía hacia la izquierda, botones integrados -->
    <div class="rest-bar" id="restBar" style="display:none;">
      <div class="rest-bar-fill" id="restBarFill"></div>
      <div class="rest-bar-time" id="restBarTime">1:00</div>
      <div class="rest-bar-btns">
        <button class="rest-mini" data-rest="minus15" aria-label="Restar 15 segundos">−15</button>
        <button class="rest-mini" data-rest="plus15" aria-label="Añadir 15 segundos">+15</button>
        <button class="rest-mini" data-rest="toggle" id="restPauseBtn" aria-label="Pausar/reanudar descanso">⏸</button>
        <button class="rest-mini" data-rest="skip" aria-label="Saltar descanso">⏭</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tabbtn" data-tab="rutina" aria-label="Ver rutina"><span class="ic">📅</span>Rutina</button>
    <button class="tabbtn" data-tab="sesion" aria-label="Entrenar"><span class="ic">🏋️</span>Entrenar</button>
    <button class="tabbtn" data-tab="historial" aria-label="Ver historial"><span class="ic">📈</span>Historial</button>
    <button class="tabbtn" data-tab="ajustes" aria-label="Ver ajustes"><span class="ic">⚙️</span>Ajustes</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
</div>

<!-- Bocadillo de cómic motivador -->
<div class="comic-overlay" id="comicOverlay">
  <div class="comic-bubble" id="comicBubble" role="status" aria-live="polite">¡A POR ELLO!</div>
</div>

<!-- Resumen de sesión (guardado automático) -->
<div class="summary-overlay" id="summaryOverlay" role="dialog" aria-modal="true" aria-label="Resumen del entrenamiento">
  <div class="sum-title">🏆 ¡Entrenamiento completado!</div>
  <div class="sum-sub" id="sumSub"></div>
  <div class="sum-saved-msg" id="sumSavedMsg" role="status" aria-live="polite">✅ Sesión guardada</div>
  <div class="sum-grid" id="sumGrid"></div>
  <div id="sumExList"></div>
  <div class="sum-btns">
    <button class="sum-done" id="sumDoneToday">✅ ¡Vale por hoy!</button>
  </div>
</div>

<!-- Auth overlay -->
<div id="authOverlay" role="dialog" aria-modal="true" aria-label="Acceder a EyeFit" tabindex="-1">
  <div class="auth-card">
    <div class="auth-logo">👁️</div>
    <div class="auth-title">EyeFit</div>
    <div class="auth-sub">Tu entrenamiento, sincronizado en la nube</div>
    <div class="auth-tabs" role="tablist" aria-label="Método de acceso">
      <button data-auth-tab="login" class="active" role="tab" aria-selected="true">Acceder</button>
      <button data-auth-tab="register" role="tab" aria-selected="false">Registrarse</button>
    </div>
    <form id="authForm" autocomplete="on">
      <input type="email" class="auth-input" id="authEmail" placeholder="Email" autocomplete="email" autocapitalize="off" spellcheck="false">
      <input type="password" class="auth-input" id="authPass" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password">
      <button type="submit" class="auth-btn" id="authSubmit">Acceder</button>
    </form>
    <div class="auth-error" id="authError"></div>
    <button class="btn btn-outline" id="authSkip" style="width:100%;margin-top:8px;display:none;">📴 Continuar sin conexión</button>
  </div>
</div>

<!-- Num pad + slider -->
<div id="numOverlay" role="dialog" aria-modal="true" aria-label="Editar peso o repeticiones" tabindex="-1">
  <div class="num-label" id="numLabel">Peso (kg)</div>
  <input type="number" class="num-input" id="numInput" inputmode="decimal" step="0.5" min="0">
  <input type="range" class="num-slider" id="numSlider" min="0" max="200" step="0.5" value="0">
  <div class="num-btns">
    <button class="num-cancel" id="numCancel">Cancelar</button>
    <button class="num-ok" id="numOk">OK</button>
  </div>
</div>

<!-- Variantes -->
<div id="varOverlay" role="dialog" aria-modal="true" aria-label="Ejercicios alternativos" tabindex="-1">
  <div class="var-title">↔️ Sustituir ejercicio</div>
  <div class="var-sub" id="varCurrentEx"></div>
  <div class="var-grid" id="varList"></div>
  <button class="var-close" id="varClose">Cancelar</button>
</div>

<!-- Ampliación GIF del ejercicio -->
<div id="imgZoomOverlay" role="dialog" aria-modal="true" aria-label="Ejercicio ampliado" tabindex="-1">
  <div class="zoom-wrap">
    <img id="zoomImg" class="zoom-img" alt="" decoding="async">
    <div class="zoom-instr" id="zoomInstr"></div>
    <button class="zoom-close" id="zoomClose" aria-label="Cerrar imagen ampliada">✕</button>
  </div>
</div>

<!-- Selector de ejercicio nuevo (editar rutina) -->
<div id="exPickerOverlay" role="dialog" aria-modal="true" aria-label="Añadir ejercicio" tabindex="-1">
  <div class="picker-title">➕ Añadir ejercicio</div>
  <div class="picker-sub" id="pickerDayLabel"></div>
  <input type="search" class="picker-search" id="pickerSearch" placeholder="Buscar ejercicio…" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="picker-list" id="pickerList"></div>
  <button class="picker-close" id="pickerClose">Cancelar</button>
</div>

<!-- Confirmación eliminación por swipe -->
<div id="swipeConfirmOverlay" role="dialog" aria-modal="true" aria-label="Confirmar eliminación de serie" tabindex="-1">
  <div class="swipe-confirm-card">
    <div class="swipe-confirm-title">🗑️ Eliminar serie</div>
    <div class="swipe-confirm-text" id="swipeConfirmText">¿Eliminar esta serie?</div>
    <div class="swipe-confirm-btns">
      <button class="btn btn-outline" id="swipeConfirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="swipeConfirmOk">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- Editar sesión del historial -->
<div id="editHistOverlay" role="dialog" aria-modal="true" aria-label="Editar sesión del historial" tabindex="-1">
  <div class="edit-hist-card">
    <div class="edit-hist-header">
      <span class="edit-hist-title">✏️ Editar sesión</span>
      <button class="edit-hist-close" id="editHistClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="edit-hist-date" id="editHistDate"></div>
    <div class="edit-hist-meta">
      <label class="eh-meta-field">
        <span class="eh-meta-lbl">Hora inicio</span>
        <input type="time" class="ehs-input" id="editHistStart" aria-label="Hora de inicio">
      </label>
      <label class="eh-meta-field">
        <span class="eh-meta-lbl">Duración (min)</span>
        <input type="number" class="ehs-input eh-dur" id="editHistDur" min="0" step="1" inputmode="numeric" aria-label="Duración en minutos">
      </label>
    </div>
    <div class="edit-hist-list" id="editHistList"></div>
    <div class="edit-hist-btns">
      <button class="btn btn-outline" id="editHistCancel">Cancelar</button>
      <button class="btn" id="editHistSave">💾 Guardar</button>
    </div>
  </div>
</div>

<div id="onboardOverlay" role="dialog" aria-modal="true" aria-label="Bienvenido a EyeFit" tabindex="-1">
  <div class="onb-card">
    <div class="onb-title" id="onbTitle">👁️ Bienvenido a EyeFit</div>
    <div class="onb-body" id="onbBody"></div>
    <div class="onb-dots" id="onbDots" aria-hidden="true"></div>
    <div class="onb-btns">
      <button class="btn btn-outline" id="onbSkip">Omitir</button>
      <button class="btn" id="onbNext">Siguiente</button>
    </div>
  </div>
</div>

<script src="utils.js" defer></script>
<script src="db.js" defer></script>
<script src="app.bbfc4a7c.js" defer></script>
</body>
</html>
