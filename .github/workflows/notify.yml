name: Notify Push

on:
  push:
    branches: [main]

jobs:
  # Notificación push tras deploy exitoso en Cloudflare Pages.
  # El push a main dispara tanto el deploy (Cloudflare Pages) como este job.
  # Esperamos a que el deploy termine (poll a la API de Cloudflare) y solo
  # entonces llamamos a la Edge Function de Supabase 'eyefit-push', que lee
  # las suscripciones de push_subscriptions y envía el Web Push con VAPID.
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy
        run: |
          PROJECT="${{ vars.CLOUDFLARE_PAGES_PROJECT || 'eyefit' }}"
          MAX_WAIT=300        # 5 minutos de timeout
          INTERVAL=15         # poll cada 15s
          ELAPSED=0
          SHA="$GITHUB_SHA"

          echo "Esperando deploy de ${PROJECT} para commit ${SHA}..."

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            DEPLOY=$(curl -sS \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${PROJECT}/deployments?per_page=1")

            # Solo mirar el deploy correspondiente a ESTE push (evita confundir
            # con un deploy previo que ya estuviera en estado 'deploy').
            DEPLOY_SHA=$(echo "$DEPLOY" | jq -r '.result[0].deployment_trigger.metadata.commit_hash // ""')
            if [ "$DEPLOY_SHA" != "$SHA" ]; then
              echo "⏳ Deploy de este commit aún no aparece (${ELAPSED}s)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              continue
            fi

            STATUS=$(echo "$DEPLOY" | jq -r '.result[0].latest_stage.name // "unknown"')
            echo "Deploy status: $STATUS (${ELAPSED}s)"

            case "$STATUS" in
              deploy)  echo "✅ Deploy exitoso en Cloudflare Pages"; exit 0 ;;
              error|canceled|failed) echo "❌ Deploy falló: $STATUS"; exit 1 ;;
              *) sleep $INTERVAL; ELAPSED=$((ELAPSED + INTERVAL)) ;;
            esac
          done

          echo "⚠️ Timeout esperando el deploy (${MAX_WAIT}s) — no se notifica."
          exit 1

      - name: Notify push update (Supabase Edge Function)
        if: success()
        run: |
          if [ -z "${{ secrets.SUPABASE_PUSH_FN_URL }}" ]; then
            echo "⚠️ SUPABASE_PUSH_FN_URL no configurado — salto notificación push."
            exit 0
          fi
          curl -sS -X POST "${{ secrets.SUPABASE_PUSH_FN_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUSH_FN_KEY }}" \
            -d '{
              "title": "🔄 EyeFit actualizado",
              "body": "Nueva versión disponible. Toca para recargar y ver las novedades.",
              "url": "./"
            }' \
            && echo "Push enviado." || echo "El servicio push no respondió (no bloquea)."
